<html>
    <head>
        <title>My Website</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header>
        <nav>
            <h2>Main Menu</h2>
            <ul>
            <li><a href="/about.html">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <h1>Welcome to my Website</h1>
        <h2>A simple place to start</h2>
        </header>

        <main>
        <h2>About this page</h2>
        <h3>Introduction</h3>
        <p>This is simple paragraph</p>
          <form>
              <label for="name">Name:</label>
              <input type="text" id="name" name="nombre">
              <label for="email">Email:</label>
              <input type="email" id="email" name="email">
              <label for="password">Password:</label>
              <input type="password" id="password" name="password">
              <select name="options" id="options">
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
              </select>
              <input type="checkbox" id="subscribe" name="subscribe">
              <label for="subscribe">Subscribe to newsletter</label>
              <select id="gender" name="gender">
                <optgroup label="Fruits">
                  <option value="apple">Apple</option>
                  <option value="banana">Banana</option>
                  <option value="orange">Orange</option>
              </optgroup>
              </select>
              <input type="radio" id="option1" name="options" value="option1">
              <label for="option1">Option 1</label>
              <input type="radio" id="option2" name="options" value="option2">
              <label for="option2">Option 2</label>
              <input type="radio" id="option3" name="options" value="option3">
              <label for="option3">Option 3</label>

              <textarea id="option1" name="option1" rows="4" cols="50">Enter your text here...</textarea>

              <input type="number" id="number" name="number" min="0" max="100">
              <input type="date" id="date" name="date">
              <input type="file" id="file" name="file">
              <input type="range" id="range" name="range" min="0" max="100">
              <input type="color" id="color" name="color">

              <input type="tel" id="phone" name="phone">
              <input type="time" id="time" name="time">
              <input type="search" id="website" name="website">

              <button type="submit">Submit</button>
          </form>

          <label for="username">Datos de Salida</label> 

          <table>
              <thead>
                  <tr>
                      <th>Header 1</th>
                      <th>Header 2</th>
                      <th>Header 3</th>
                      <th>Header 4</th>
                  </tr>
              </thead>
              <tbody>
                  <tr>
                      <td>Dato 1</td>
                      <td>Dato 2</td>
                      <td>Dato 3</td>
                      <td>Dato 4</td>
                  </tr>
                  <tr>
                      <td>Dato 5</td>
                      <td>Dato 6</td>
                      <td>Dato 7</td>
                      <td>Dato 8</td>
                  </tr>
              </tbody>
          </table>

        </main>

        

        <footer>
        <h2>Site Information</h2>

        </footer>
    </body>
</html>

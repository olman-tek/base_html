<style>
  :host {
    --bright-blue: oklch(51.01% 0.274 263.83);
    --electric-violet: oklch(53.18% 0.28 296.97);
    --vivid-pink: oklch(69.02% 0.277 332.77);
    --orange-red: oklch(63.32% 0.24 31.68);
    --gray-900: oklch(19.37% 0.006 300.98);
    --gray-700: oklch(36.98% 0.014 302.71);

    --gradient-vertical: linear-gradient(180deg, var(--orange-red) 0%, var(--vivid-pink) 50%, var(--electric-violet) 100%);
    --gradient-horizontal: linear-gradient(90deg, var(--orange-red) 0%, var(--vivid-pink) 50%, var(--electric-violet) 100%);

    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    display: block;
    height: 100dvh;
  }

  h1 {
    font-size: 3.125rem;
    font-weight: 600;
    line-height: 100%;
    letter-spacing: -0.125rem;
    margin: 0;
    background: var(--gradient-horizontal);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p {
    margin: 1.5rem 0 0;
    color: var(--gray-700);
  }

  main {
    width: 100%;
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    box-sizing: inherit;
  }

  .content {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
    max-width: 800px;
    gap: 1rem;
  }

  .divider {
    width: 1px;
    align-self: stretch;
    background: var(--gradient-vertical);
    margin-inline: 0.5rem;
  }

  @media screen and (max-width: 650px) {
    .content {
      flex-direction: column;
    }

    .divider {
      height: 1px;
      width: 100%;
      background: var(--gradient-horizontal);
      margin-block: 1.5rem;
    }
  }
</style>

<main>
  <div class="content">
    <div class="left-side">
      <h1>Calculadora</h1>
      <p>Hecha con Angular y signals.</p>
    </div>

    <div class="divider" role="separator" aria-label="Divider"></div>

    <div class="right-side">
      <app-calculadora />
    </div>
  </div>
</main>
